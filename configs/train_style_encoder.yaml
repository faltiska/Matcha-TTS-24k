# @package _global_

defaults:
  - data: corpus-24k
  - model: style_encoder/default
  - callbacks: default
  - logger: tensorboard
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - _self_

task_name: "train_style_encoder"
run_name: style_encoder_v22
tags: ["style_encoder", "v22"]

train: True
test: False
limit_val_batches: 1.0

data:
  num_workers: 2

seed: 1234

# The previous 96-dimensional style encoder cannot be resumed for v21's 128-dimensional speaker embeddings.
ckpt_path: null

callbacks:
  model_checkpoint:
    monitor: val/style_loss
    mode: min
    save_on_train_epoch_end: false

model:
  optimizer:
    # reduced from 1e-4 to 5e-5 at epoch 200
    lr: 1e-4
