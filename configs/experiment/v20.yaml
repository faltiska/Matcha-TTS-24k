# @package _global_
#
# More data for speakers 13 and 14.
# Added FiLM / AdaLN for speaker embeddings in Encoder.
# Added an Attention and an FFN layer for the Duration Predictor.
# Duration Predictor input is now the raw embeddings detached, instead of the Encoder output.
# All 3 changes are in text_encoder.py.
# Incremented the offset in Duration loss calculation from 2 to 4 (see matcha_tts.py). 
# Duration loss uses Huber instead of MSE, added duration_loss_threshold config.
# I've also changed activations from ReLU to SiLU, everywhere.

run_name: v20

defaults:
  - override /data: corpus-24k

data:
  num_workers: 8
  max_frames_per_batch: 30000

ckpt_path: null

model:
  spk_emb_dim: 128
  prior_loss: true
  # A larger value increases the gap between train and validation loss, so I think it affects generalization.
  prior_loss_threshold: 0.08
  duration_loss_threshold: 0.22
  
  encoder:
    encoder_params:
      # Speaker embedding is no longer concatenated; it conditions the encoder via per-layer FiLM,
      # so the backbone runs at n_channels, not n_channels + spk_emb_dim.
      # Head dim: n_channels / n_heads = 64, divisible by 8
      n_channels: 384
      # 384 * 3 = 1152
      filter_channels: 1152
      n_heads: 6
      n_layers: 4
      kernel_size: 5
      p_dropout: 0.05
      
      prenet: true
      # should not go over 3, it affects prior loss
      # 5 is slightly worse, 7 is considerably worse 
      prenet_kernel_size: 3
    
    duration_predictor_params:
      # head dim is filter_channels_dp / n_heads = 64, divisible by 8
      filter_channels_dp: 384
      n_heads: 6
      n_layers: 4
      kernel_size: 3
      p_dropout: 0.05
  
  decoder:
    # other figures that could work
    # 384 = 6 * 64
    # 360 = 5 * 72
    # 336 = 6 * 56
    channels: [384, 384]
    attention_head_dim: 64
    num_heads: 6
    dropout: 0.05
  
  cfm:
    use_mu_prior: true

  optimizer:
    # Schedule:
    # Epoch 0:
    #  lr: 1e-4
    #  weight_decay: 1e-3
    # Epoch 239:
    #  lr: 8e-5
    #  weight_decay: 8e-4
    lr: 1e-4
    weight_decay: 1e-3
    
callbacks:
  model_checkpoint:
    every_n_epochs: 5

trainer:
  check_val_every_n_epoch: 5
