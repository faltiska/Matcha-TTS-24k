# @package _global_
#
# More data for speakers 13 and 14.
# Added FiLM / AdaLN for speaker embeddings in Encoder.
# Added an Attention and an FFN layer for the Duration Predictor.
# Incremented the offset in Duration loss calculation from 2 to 4 (see matcha_tts.py). 
# Duration loss uses Huber instead of MSE, added duration_loss_threshold in config.
# I've also changed activations from ReLU to SiLU, everywhere.
# I've started using Huber instead of MSE for Duration Loss.
# Made changes to compile the Decoder too.
# I have added conditioning on the timestep for the Decoder, using FiLM / AdaLN.
# The new TimestepConditionedTransformerBlock increased the model size significantly but without 
# slowing down training by much. Model is now 93M params, but since the Decoder is compiled now, the VRAM memory used 
# is still low, at around 12.5GB with the rather large max_frames_per_batch I am using.

run_name: v20

defaults:
  - override /data: corpus-24k

data:
  num_workers: 8
  max_frames_per_batch: 30000
  
ckpt_path: logs/train/v20/checkpoint_epoch=1904.ckpt

model:
  spk_emb_dim: 128
  prior_loss: true

  # About choosing the right Delta for Huber. 
  # Smaller prior loss values like 0.1 or below, combined with large LR like 1e-4 make the Encoder training unstable. 
  # I get huge steps in the loss, which may correct after some 5-10 epochs or may not correct at all, shooting up and
  # never dropping back. It must be because of the MAS error positive feedback loop: MAS depends on the Encoder to 
  # find good alignment but the Encoder loss depends on MAS predicting good durations.

  # 50% prior errors are below 0.04 after 500 epochs
  # 75% prior errors are below 0.07 after 500 epochs
  # 90% prior errors are below 0.12 after 500 epochs
  # 95% prior errors are below 0.15 after 500 epochs
  # 99% prior errors are below 0.24 after 500 epochs *
  # All prior errors are below 1.3 after 500 epochs
  # Changed from 0.12 to 0.23 at epoch 1689 as an experiment
  # Changed to 0.07 at epoch 1904
  prior_loss_threshold: 0.07
  
  # 50% duration errors are below 0.08 after 500 epochs
  # 75% duration errors are below 0.14 after 500 epochs
  # 90% duration errors are below 0.22 after 500 epochs
  # 95% duration errors are below 0.29 after 500 epochs
  # 99% duration errors are below 0.47 after 500 epochs *
  # All duration errors are below 2.6 after 500 epochs
  # Changed from 0.25 to 0.41 at epoch 1689 as an experiment
  # Changed 0.14 at epoch 1904 
  duration_loss_threshold: 0.14
  
  encoder:
    encoder_params:
      # Speaker embedding is no longer concatenated; it conditions the encoder via per-layer FiLM,
      # so the backbone runs at n_channels, not n_channels + spk_emb_dim.
      # Head dim: n_channels / n_heads = 64, divisible by 8
      n_channels: 384
      # 384 * 3 = 1152
      filter_channels: 1152
      n_heads: 6
      n_layers: 4
      kernel_size: 5
      p_dropout: 0.05
      
      prenet: true
      # should not go over 3, it affects prior loss
      # 5 is slightly worse, 7 is considerably worse 
      prenet_kernel_size: 3
    
    duration_predictor_params:
      # head dim is filter_channels_dp / n_heads = 64, divisible by 8
      filter_channels_dp: 384
      n_heads: 6
      n_layers: 4
      kernel_size: 3
      p_dropout: 0.05
  
  decoder:
    # Other figures that could work
    # 384 = 6 * 64
    # 360 = 5 * 72
    # 336 = 6 * 56
    # The rule for divisibility by num_heads applies to the second figure only
    channels: [384, 384]
    attention_head_dim: 64
    num_heads: 6
    num_mid_blocks: 2 # could be worth increasing this for in v21
    dropout: 0.05
  
  cfm:
    use_mu_prior: true

  optimizer:
    # Schedule (480 steps / epoch):
    #     0: 8e-5 / 2e-4
    #  1129: 4e-5 / 1e-4
    #  1449: 2e-5 / 5e-5
    #  1898: 1e-5 / 2e-5
    lr: 1e-5
    weight_decay: 2e-5
    
callbacks:
  model_checkpoint:
    every_n_epochs: 5

trainer:
  check_val_every_n_epoch: 5
