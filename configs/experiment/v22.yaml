# @package _global_
#
# Introduced a triangular_downsample method, see model.py, which produces sharper mels.
# Fixed 2 bugs in the Decoder, which makes it incompatible with the v21 checkpoint.
# I had to use the reset tool to create a ckpt with a fully trained Encoder and Duration Predictor, but an empty Decoder:
# python -m matcha.utils.reset_decoder \
#  logs/train/v21-prod/checkpoint_epoch=1313-final.ckpt \
#  logs/train/v22/checkpoint_epoch=004.ckpt \
#  -o logs/train/v22/empty-decoder.ckpt
# The triangular downsample is more precise, the generated speech feels sharper and brighter.
# But that makes it bring up all the Encoder errors, making them more audible.
# The old one was blurring more, and the Decoder had an easier job closing the gap between the Encoder   
# output and the ground truth.
# I decided to go back to the old downsample for now.

run_name: v22

defaults:
  - override /data: corpus-24k

data:
  num_workers: 8
  max_frames_per_batch: 30000

#ckpt_path: null
#ckpt_path: logs/train/v22/empty-decoder.ckpt
ckpt_path: logs/train/v22/checkpoint_epoch=2214.ckpt

model:
  spk_emb_dim: 128
  prior_loss: false
  duration_loss: false
  log_diagnostics: false

  prior_loss_threshold: 0.96
  duration_loss_threshold: 0.96
  
  encoder:
    encoder_params:
      # Head dim: n_channels / n_heads = 64, divisible by 8
      n_channels: 384
      # 384 * 3 = 1152
      filter_channels: 1152
      n_heads: 6
      n_layers: 4
      kernel_size: 5
      p_dropout: 0.05
      
      prenet: true
      # should not go over 3, it affects prior loss
      # 5 is slightly worse, 7 is considerably worse 
      prenet_kernel_size: 3
    
    duration_predictor_params:
      # head dim is filter_channels_dp / n_heads = 64, divisible by 8
      # I should try with 256 / 4 / 3
      filter_channels_dp: 384
      n_heads: 6
      n_layers: 4
      kernel_size: 3
      p_dropout: 0.1
  
  decoder:
    # The rule for divisibility by num_heads applies to the second figure only
    channels: [384, 384]
    attention_head_dim: 64
    num_heads: 6
    num_mid_blocks: 2
    dropout: 0.05
  
  cfm:
    use_mu_prior: true

  optimizer:
    # Epoch 0
    # lr: 1e-4
    # weight_decay: 2e-4
    # Epoch 1184
    # lr: 6e-5
    # weight_decay: 1e-4
    # Epoch 1724
    # lr: 2e-5
    # weight_decay: 5e-5
    # Epoch 2214
    lr: 1e-5
    weight_decay: 2e-5
    
callbacks:
  model_checkpoint:
    every_n_epochs: 5

trainer:
  check_val_every_n_epoch: 5
