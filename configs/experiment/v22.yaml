# @package _global_
#
# 1. Bug fixes and improvements in the Decoder:
# - the attention mask is cast to boolean, so padded frames are really excluded instead of being
#   added to the attention logits, which left them visible
# - LoRACompatibleLinear replaced with nn.Linear (deprecated, same parameter names)
# - the feed-forward branch no longer has a second adaptive layer norm of its own, which was
#   modulating it twice; it now uses the shift, scale and gate that the attention adaptive norm
#   already produces, as adaLN-Zero intends.
#   This change makes the model incompatible with the v21 checkpoints.
# - the modulation projection is explicitly zeroed after the global weight init, so both gates
#   start closed and each block starts as an identity. Diffusers does not zero it and the Xavier
#   pass used to overwrite it, so in v21 the blocks started with random gates. This is correct but
#   slower to get going, so early epochs may trail v21.
# 2. Changed the Decoder to sample more steps in the middle of the trajectory during training.
# 3. Changed the Decoder to take shorter steps at the start of the trajectory during inference.

# I wanted to reuse de fully trained encoder and duration predictor from v21, but the new decoder is not compatible with
# v21 ckpts. I had to train with the v22 code to get a ckpt from which I can take the decoder.
# Next I used the reset tool to create a ckpt with a fully trained v21 Encoder and Duration Predictor, and the v22 Decoder:
# python -m matcha.utils.reset_decoder \
#  logs/train/v21-prod/checkpoint_epoch=1313-final.ckpt \
#  logs/train/v22/checkpoint_epoch=004.ckpt \
#  -o logs/train/v22/empty-decoder.ckpt
# Then I trained with: 
#   prior_loss: false
#   duration_loss: false
# I've learned that training with encoder and duration predictor dropout set to 0 makes the decoder validation loss
# start to grow while the train loss drops normally, so I concluded it hurts generalization.

run_name: v22

defaults:
  - override /data: corpus-24k

data:
  num_workers: 8
  max_frames_per_batch: 30000

# Stopped and resumed from epoch 139 so I can set the encoder and duration predictor dropout to 0 
ckpt_path: logs/train/v22/checkpoint_epoch=139.ckpt

model:
  spk_emb_dim: 128
  prior_loss: false
  duration_loss: false
  log_diagnostics: false

  prior_loss_threshold: 0.95
  duration_loss_threshold: 1.1
  
  encoder:
    encoder_params:
      # Head dim: n_channels / n_heads = 64, divisible by 8
      n_channels: 384
      # 384 * 3 = 1152
      filter_channels: 1152
      n_heads: 6
      n_layers: 4
      kernel_size: 5
      p_dropout: 0.05
      
      prenet: true
      # should not go over 3, it affects prior loss
      # 5 is slightly worse, 7 is considerably worse 
      prenet_kernel_size: 3
    
    duration_predictor_params:
      # head dim is filter_channels_dp / n_heads = 64, divisible by 8
      filter_channels_dp: 384
      n_heads: 6
      n_layers: 4
      kernel_size: 3
      p_dropout: 0.1
  
  decoder:
    # The rule for divisibility by num_heads applies to the second figure only
    channels: [384, 384]
    attention_head_dim: 64
    num_heads: 6
    num_mid_blocks: 2
    dropout: 0.1
  
  cfm:
    use_mu_prior: true

  optimizer:
# Epoch 0 
    lr: 1e-4
    weight_decay: 2e-4
    
callbacks:
  model_checkpoint:
    every_n_epochs: 5

trainer:
  check_val_every_n_epoch: 5
