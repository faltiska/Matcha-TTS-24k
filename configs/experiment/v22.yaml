# @package _global_
#
# Run with prior loss = false, but Encoder and Duration Predictor zeroed out.
# I want to have them trained from scratch on the fully trained Encoder from v21 and see if that reduces
# overfitting. Or if it is a good idea to train in 2 steps, first the Encoder alone, then the other 2 components 
# with a frozen Encoder.
#
# I intend to run 1 epoch to get an empty ckpt with a Decoder and Duration Predictor.
# Then I will use reset_decoder_and_duration.py to combine them with the fully trained encoder from v21.
#
#  python -m matcha.utils.reset_decoder_and_duration \
#  logs/train/v21-prod/checkpoint_epoch=1313-final.ckpt \
#  logs/train/v22/checkpoint_epoch=004.ckpt \
#  -o logs/train/v22/full_encoder_blank_decoder_and_duration_predictor.ckpt
#
# Then I will train starting from full_encoder_blank_decoder_and_duration_predictor.ckpt
# I also decided to reduce the Duration Predictor size, which overfits significantly and to increase Decoder's 
# num_mid_blocks from 2 to 4.

run_name: v22

defaults:
  - override /data: corpus-24k

data:
  num_workers: 8
  max_frames_per_batch: 30000

#ckpt_path: null
#ckpt_path: logs/train/v22/full_encoder_blank_decoder_and_duration_predictor.ckpt
ckpt_path: logs/train/v22/runs/2026-08-01_10-06-38/checkpoints/checkpoint_epoch=024.ckpt

model:
  spk_emb_dim: 128
  prior_loss: false

  prior_loss_threshold: 0.96
  duration_loss_threshold: 0.96
  
  encoder:
    encoder_params:
      # Head dim: n_channels / n_heads = 64, divisible by 8
      n_channels: 384
      # 384 * 3 = 1152
      filter_channels: 1152
      n_heads: 6
      n_layers: 4
      kernel_size: 5
      p_dropout: 0.05
      
      prenet: true
      # should not go over 3, it affects prior loss
      # 5 is slightly worse, 7 is considerably worse 
      prenet_kernel_size: 3
    
    duration_predictor_params:
      # head dim is filter_channels_dp / n_heads = 64, divisible by 8
      filter_channels_dp: 256
      n_heads: 4
      n_layers: 3
      kernel_size: 3
      p_dropout: 0.15
  
  decoder:
    # The rule for divisibility by num_heads applies to the second figure only
    channels: [384, 384]
    attention_head_dim: 64
    num_heads: 6
    num_mid_blocks: 4
    dropout: 0.05 # I should try with a larget dropout
  
  cfm:
    use_mu_prior: true

  optimizer:
    # Epoch 0  
    lr: 8e-5
    weight_decay: 1e-4
    
callbacks:
  model_checkpoint:
    every_n_epochs: 5

trainer:
  check_val_every_n_epoch: 5
