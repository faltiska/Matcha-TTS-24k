[build-system]
requires = ["setuptools", "wheel", "cython>=3.0.0", "numpy>=1.26.0", "packaging"]
build-backend = "setuptools.build_meta"

[project]
name = "matcha-tts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # Pinned: torch 2.14 measured 30-40% slower in training than 2.12.1, so stay on 2.12.
    # torchaudio +cu132 builds are published only in the test channel, see [tool.uv.sources] below.
    "torch==2.12.1+cu132",
    "torchaudio==2.11.0+cu132",
    "torchcodec==0.16.0+cu132",
    # triton is needed by super-monotonic-align, which declares no dependencies of its own.
    # torch happens to pull it on linux/py<3.15, but keep it explicit so it is not accidental.
    "triton",
    "lightning",
    "torchmetrics",
    "torchdiffeq",
    "torch-ema",
    "phonemizer",
    "nemo_text_processing",
    "vocos",
    "av",
    "hydra-core",
    "hydra-colorlog",
    "hydra-optuna-sweeper",
    "omegaconf",
    "rich",
    "pytest",
    "tensorboard",
    "librosa",
    "numpy",
    "einops",
    "inflect",
    "scipy",
    "conformer",
    "diffusers",
    "parse",
    "setuptools",
    "pymcd",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "super-monotonic-align @ git+https://github.com/supertone-inc/super-monotonic-align.git",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-test-cu132"
url = "https://download.pytorch.org/whl/test/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]
torchcodec = [{ index = "pytorch-cu132" }]
torchaudio = [{ index = "pytorch-test-cu132" }]

[tool.setuptools.packages.find]
include = ["matcha*"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
